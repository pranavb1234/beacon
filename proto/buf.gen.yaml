version: v2
plugins:
  # Generates Go message types (*.pb.go)
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: ../internal/pb
    opt:
      - paths=source_relative

  # Generates gRPC service stubs (*_grpc.pb.go)
  - remote: buf.build/grpc/go:v1.4.0
    out: ../internal/pb
    opt:
      - paths=source_relative
