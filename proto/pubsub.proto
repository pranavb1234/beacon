syntax = "proto3";

package pubsub.v1;

option go_package = "github.com/pranavb1234/beacon/internal/pb;pb";

// Broker provides single-node pub/sub streaming capabilities over gRPC.
service Broker {
  // Publish sends a payload to a topic and returns its assigned sequence number.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Subscribe opens a server-streaming connection to receive messages on a topic.
  rpc Subscribe(SubscribeRequest) returns (stream Message);

  // Ack acknowledges successful receipt and processing of a message by a subscriber.
  rpc Ack(AckRequest) returns (AckResponse);
}

// Internal provides cluster-internal RPCs for inter-broker coordination.
service Internal {
  // Heartbeat is sent periodically between cluster peer brokers to monitor liveness.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Forward proxies a Publish call from a non-owner node to the topic's owner node.
  rpc Forward(ForwardPublishRequest) returns (PublishResponse);

  // ForwardSubscribe proxies a Subscribe stream from a non-owner node to the topic's owner,
  // then streams messages back through the forwarding node to the original client.
  rpc ForwardSubscribe(SubscribeRequest) returns (stream Message);

  // Replicate streams published messages and offset commits from the topic owner to the replica.
  rpc Replicate(stream ReplicateMsg) returns (stream ReplicateAck);

  // SyncTopic streams historical ring buffer messages from owner to a newly assigned or catching-up replica.
  rpc SyncTopic(SyncRequest) returns (stream ReplicateMsg);

  // Handoff coordinates ownership transfer of a topic from current owner to a synced returning node.
  rpc Handoff(HandoffRequest) returns (HandoffResponse);
}

// PublishRequest contains the message payload to be published to a specific topic.
message PublishRequest {
  // topic is the target topic name where the message will be published.
  string topic = 1;

  // payload is the raw binary content of the message.
  bytes payload = 2;

  // client_id identifies the publishing client instance (for deduplication / idempotency).
  string client_id = 3;

  // client_seq is the monotonic per-client publication sequence number.
  uint64 client_seq = 4;
}

// PublishResponse acknowledges message publication with its assigned monotonic sequence number.
message PublishResponse {
  // sequence is the unique, monotonically increasing sequence number assigned to this message within the topic.
  uint64 sequence = 1;
}

// SubscribeRequest defines subscription parameters for streaming messages from a topic.
message SubscribeRequest {
  // topic is the name of the topic to subscribe to.
  string topic = 1;

  // group is the optional consumer group ID. When provided, messages are distributed among group members.
  string group = 2;

  // from_seq is the sequence number to start streaming from (0 indicates new messages only).
  uint64 from_seq = 3;

  // subscriber_id is the unique identifier for this subscriber connection.
  string subscriber_id = 4;
}

// Message is an individual event streamed to subscribers.
message Message {
  // topic is the name of the topic the message belongs to.
  string topic = 1;

  // seq is the sequence number of this message within the topic.
  uint64 seq = 2;

  // payload is the raw message content published by the producer.
  bytes payload = 3;

  // timestamp_ns is the publication time recorded by the broker as Unix nanoseconds.
  int64 timestamp_ns = 4;
}

// AckRequest informs the broker that a subscriber has successfully handled a message.
message AckRequest {
  // topic is the topic name of the acknowledged message.
  string topic = 1;

  // group is the consumer group ID if subscribing as part of a group.
  string group = 2;

  // subscriber_id is the unique ID of the acknowledging subscriber.
  string subscriber_id = 3;

  // seq is the sequence number of the message being acknowledged.
  uint64 seq = 4;
}

// AckResponse is an empty confirmation acknowledging message processing.
message AckResponse {}

// ForwardPublishRequest wraps a PublishRequest with routing metadata for inter-broker forwarding.
message ForwardPublishRequest {
  // request is the original client publish request being forwarded.
  PublishRequest request = 1;

  // hop_count is incremented on each forward hop; rejected if > 1 to prevent forwarding loops.
  int32 hop_count = 2;

  // source_node_id is the ID of the forwarding node (for logging and loop detection).
  string source_node_id = 3;
}

// HeartbeatRequest contains peer node liveness and epoch information.
message HeartbeatRequest {
  // node_id is the unique identifier of the sending broker.
  string node_id = 1;

  // epoch is the term/epoch counter of the sending broker.
  uint64 epoch = 2;

  // timestamp is the Unix timestamp (nanoseconds) when heartbeat was dispatched.
  int64 timestamp = 3;
}

// HeartbeatResponse acknowledges receipt of a heartbeat.
message HeartbeatResponse {
  // node_id is the unique identifier of the responding broker.
  string node_id = 1;

  // ok indicates whether the heartbeat was accepted.
  bool ok = 2;
}

// ReplicateMsg carries live published messages or consumer group offset updates from owner to replica.
message ReplicateMsg {
  // topic is the topic name being replicated.
  string topic = 1;

  // epoch is the term/epoch of the sending owner.
  uint64 epoch = 2;

  // seq is the message sequence number.
  uint64 seq = 3;

  // payload is the raw payload of the published message.
  bytes payload = 4;

  // timestamp_ns is the original publication timestamp.
  int64 timestamp_ns = 5;

  // group is the consumer group ID if this message replicates a committed offset update.
  string group = 6;

  // committed_offset is the highest contiguous acked sequence for the consumer group.
  uint64 committed_offset = 7;

  // is_offset_commit indicates whether this message is an offset commit replication rather than a data message.
  bool is_offset_commit = 8;
}

// ReplicateAck acknowledges receipt and persistence of a replicated message or offset by the replica.
message ReplicateAck {
  // topic is the topic name.
  string topic = 1;

  // seq is the sequence number acknowledged.
  uint64 seq = 2;

  // epoch is the replica's known epoch.
  uint64 epoch = 3;

  // ok indicates whether the replica accepted the message (rejected if epoch is stale).
  bool ok = 4;
}

// SyncRequest is sent by a replica or recovering node to catch up from a given sequence number.
message SyncRequest {
  // topic is the topic to synchronize.
  string topic = 1;

  // from_seq is the sequence number to start replaying from (inclusive).
  uint64 from_seq = 2;

  // epoch is the caller's current epoch.
  uint64 epoch = 3;
}

// HandoffRequest requests graceful ownership transfer from current owner to returning node.
message HandoffRequest {
  // topic is the topic being transferred.
  string topic = 1;

  // new_owner_id is the node ID taking over ownership.
  string new_owner_id = 2;

  // epoch is the new higher epoch to transition into.
  uint64 epoch = 3;
}

// HandoffResponse confirms ownership transfer.
message HandoffResponse {
  // ok indicates whether handoff succeeded.
  bool ok = 1;

  // epoch is the acknowledged epoch.
  uint64 epoch = 2;
}


