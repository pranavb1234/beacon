syntax = "proto3";

package pubsub.v1;

option go_package = "github.com/pranavb1234/beacon/internal/pb;pb";

// PingService provides a minimal health/ping RPC placeholder.
service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
