name: beacon

# Three-node broker cluster + Prometheus + Grafana.
# All broker nodes share a custom network so they can resolve each other by name.

services:
  broker1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BEACON_NODE_ID: "broker1"
      BEACON_ADVERTISE_ADDR: "broker1:9001"
      BEACON_GRPC_ADDR: ":9001"
      BEACON_METRICS_ADDR: ":9091"
      BEACON_PEERS: "broker2:9001,broker3:9001"
      BEACON_RING_VNODES: "150"
      BEACON_BUFFER_SIZE: "10000"
      BEACON_BACKPRESSURE_POLICY: "block"
    ports:
      - "9001:9001"   # gRPC (client-facing)
      - "9091:9091"   # Prometheus metrics
    networks:
      - beacon
    restart: unless-stopped

  broker2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BEACON_NODE_ID: "broker2"
      BEACON_ADVERTISE_ADDR: "broker2:9001"
      BEACON_GRPC_ADDR: ":9001"
      BEACON_METRICS_ADDR: ":9091"
      BEACON_PEERS: "broker1:9001,broker3:9001"
      BEACON_RING_VNODES: "150"
      BEACON_BUFFER_SIZE: "10000"
      BEACON_BACKPRESSURE_POLICY: "block"
    ports:
      - "9002:9001"
      - "9092:9091"
    networks:
      - beacon
    restart: unless-stopped

  broker3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BEACON_NODE_ID: "broker3"
      BEACON_ADVERTISE_ADDR: "broker3:9001"
      BEACON_GRPC_ADDR: ":9001"
      BEACON_METRICS_ADDR: ":9091"
      BEACON_PEERS: "broker1:9001,broker2:9001"
      BEACON_RING_VNODES: "150"
      BEACON_BUFFER_SIZE: "10000"
      BEACON_BACKPRESSURE_POLICY: "block"
    ports:
      - "9003:9001"
      - "9093:9091"
    networks:
      - beacon
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - beacon
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "beacon"
    ports:
      - "3000:3000"
    networks:
      - beacon
    restart: unless-stopped

networks:
  beacon:
    driver: bridge
