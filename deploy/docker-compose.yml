name: beacon

# Three-node Beacon broker cluster with consistent-hash request routing and healthchecks.
# Each broker runs as non-root, listens on :9001 internally, and connects to peers via docker network.
# Host ports:
#   broker1 -> 50051 (gRPC), 9091 (metrics)
#   broker2 -> 50052 (gRPC), 9092 (metrics)
#   broker3 -> 50053 (gRPC), 9093 (metrics)

services:
  broker1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: beacon-broker1
    environment:
      BEACON_NODE_ID: "broker1"
      BEACON_LISTEN_ADDR: ":9001"
      BEACON_PEERS: "broker2=broker2:9001,broker3=broker3:9001"
      BEACON_HEARTBEAT_INTERVAL: "1s"
      BEACON_HEARTBEAT_TIMEOUT: "3s"
      BEACON_RING_VNODES: "150"
      BEACON_BUFFER_SIZE: "10000"
      BEACON_BACKPRESSURE_POLICY: "block"
      BEACON_METRICS_ADDR: ":9091"
    ports:
      - "50051:9001"   # Host port 50051 -> Container port 9001
      - "9091:9091"   # Metrics
    networks:
      - beacon-cluster
    healthcheck:
      test: ["CMD", "/beacon-broker", "-healthcheck", "-addr", "127.0.0.1:9001"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  broker2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: beacon-broker2
    environment:
      BEACON_NODE_ID: "broker2"
      BEACON_LISTEN_ADDR: ":9001"
      BEACON_PEERS: "broker1=broker1:9001,broker3=broker3:9001"
      BEACON_HEARTBEAT_INTERVAL: "1s"
      BEACON_HEARTBEAT_TIMEOUT: "3s"
      BEACON_RING_VNODES: "150"
      BEACON_BUFFER_SIZE: "10000"
      BEACON_BACKPRESSURE_POLICY: "block"
      BEACON_METRICS_ADDR: ":9091"
    ports:
      - "50052:9001"   # Host port 50052 -> Container port 9001
      - "9092:9091"   # Metrics
    networks:
      - beacon-cluster
    healthcheck:
      test: ["CMD", "/beacon-broker", "-healthcheck", "-addr", "127.0.0.1:9001"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  broker3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: beacon-broker3
    environment:
      BEACON_NODE_ID: "broker3"
      BEACON_LISTEN_ADDR: ":9001"
      BEACON_PEERS: "broker1=broker1:9001,broker2=broker2:9001"
      BEACON_HEARTBEAT_INTERVAL: "1s"
      BEACON_HEARTBEAT_TIMEOUT: "3s"
      BEACON_RING_VNODES: "150"
      BEACON_BUFFER_SIZE: "10000"
      BEACON_BACKPRESSURE_POLICY: "block"
      BEACON_METRICS_ADDR: ":9091"
    ports:
      - "50053:9001"   # Host port 50053 -> Container port 9001
      - "9093:9091"   # Metrics
    networks:
      - beacon-cluster
    healthcheck:
      test: ["CMD", "/beacon-broker", "-healthcheck", "-addr", "127.0.0.1:9001"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
    restart: unless-stopped

networks:
  beacon-cluster:
    driver: bridge
